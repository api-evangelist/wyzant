    type: Documentation
    note: Official Wyzant API & Data Feed documentation - Search API and Data Feed endpoints, parameters, XML/JSON, API key.
  - url: https://support.wyzant.com/hc/en-us/articles/115005857506-Affiliate-platform-FAQs
    type: Documentation
    note: Affiliate platform FAQ - partner program, API/datafeed/widgets, once-per-day feed guidance, lead bounty and payment schedule.
  - url: https://www.wyzant.com/partner/shareasale/api
    type: Documentation
    note: Partner API page - ShareASale-based affiliate program, feeds and search API integration options.
  - url: https://support.wyzant.com/hc/en-us/articles/208598116-What-is-the-service-fee
    type: Documentation
    note: Consumer service fee (percentage of lesson cost) charged on top of the tutor's hourly rate.
  - url: https://highered.wyzant.com/partner
    type: Website
    note: Wyzant partner program landing page (www.wyzant.com/partner redirects here).
  - url: https://www.wyzant.com
    type: Website
    note: Consumer tutoring marketplace - no public consumer API surfaced.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket or other server-push transport exists on Wyzant. Wyzant has no
    public consumer API; its only documented programmatic surface is the
    partner-only Search API and Data Feed, both request/response HTTP. No
    AsyncAPI document was created because there is no realtime/streaming
    transport to model.
