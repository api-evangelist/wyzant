description: >-
  FinOps view of Wyzant. Wyzant is a two-sided tutoring marketplace rather than
  a metered API vendor, so "spend" depends on which side you are on. For a
  student/consumer, cost is per lesson - the tutor's hourly rate times lesson
  length, plus a Wyzant service fee (a percentage of lesson cost). For a
  partner/affiliate, the Search API and Data Feed carry no usage fee; instead
  the relationship is revenue-positive - the partner earns a bounty per
  qualified student lead referred to Wyzant. There is no per-call or
  per-record API billing to manage on either side, so traditional cloud-style
  FinOps metering does not apply; the figures to track are lesson spend
  (students) and lead revenue (partners).
notes: >-
  No usage-metered API invoice exists. Track consumer lesson spend and the
  service-fee percentage on the student side, and per-lead bounty revenue on the
  partner side. Verify the current service fee and bounty amounts with Wyzant
  during reconciliation.
