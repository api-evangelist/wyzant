meters:
- name: lesson_hours
  description: Tutor hours booked, billed at each tutor's hourly rate (student side).
  unit: hours
  aggregation: sum
  dimensions:
  - student
  - tutor
  - subject
- name: service_fee
  description: Wyzant service fee charged as a percentage of lesson cost (student side).
  unit: usd
  aggregation: sum
  dimensions:
  - student
  - lesson
- name: qualified_leads
  description: Qualified student leads referred by a partner, each earning a bounty (partner side).
  unit: leads
  aggregation: sum
  dimensions:
  - partner
  - channel
principles:
- name: Visibility
  description: Students track lesson hours and service fees per tutor/subject; partners track qualified leads per channel.
- name: Allocation
  description: Use partner ChannelName labels to attribute leads (and bounty revenue) to specific placements or campaigns.
- name: Optimization
  description: Students optimize by using the Good Fit Guarantee first hour and comparing tutor rates; partners optimize placements toward the highest-converting subjects/locations.
- name: Accountability
  description: Reconcile monthly - lesson spend for students, and bounty payouts (processed on the 15th for the prior month) for partners.
