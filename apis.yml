name: Wyzant
kind: company
description: Wyzant is a US tutoring marketplace that connects students with
  independent tutors for in-person and online lessons across thousands of
  subjects. It is a consumer product, not a developer platform - students book
  and pay for lessons through wyzant.com and pay a service fee on top of each
  tutor's hourly rate, and there is no public REST API for managing lessons,
  bookings, messages, or payments. Wyzant does, however, expose a real
  partner/affiliate data API and data feed at data.wyzant.com for approved
  affiliates (via the ShareASale-based partner program). These let a partner
  run real-time keyword/location searches against the live tutor database and
  download a full snapshot of all active tutors in XML or JSON, keyed by a
  per-partner API key, so partners can surface Wyzant tutors on their own sites
  and earn a per-lead bounty. Access requires a partner account; the API is not
  open to the general public.
