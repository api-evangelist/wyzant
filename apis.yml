apis:
- aid: wyzant:wyzant-tutor-search-api
  name: Wyzant Tutor Search API
  tags:
  - Tutors
  - Search
  - Affiliate
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://support.wyzant.com/hc/en-us/articles/115005857526-API-Data-Feed-Documentation
  baseURL: https://data.wyzant.com
  properties:
  - url: https://support.wyzant.com/hc/en-us/articles/115005857526-API-Data-Feed-Documentation
    type: Documentation
  - url: https://support.wyzant.com/hc/en-us/articles/115005857526-API-Data-Feed-Documentation
    type: APIReference
  - url: openapi/wyzant-openapi.yml
    type: OpenAPI
  description: Real-time search against Wyzant's live tutor database for approved
    affiliates. An HTTP POST to /api/search with a partner API key and search
    parameters (SearchString, ZIP, Distance, MinHourly/MaxHourly, MinAge/MaxAge,
    gender, MaxResults) returns matching active tutors as XML or JSON, with
    fields such as tutor name, location, fee per hour, rating, subjects, and a
    tracked profile link. Intended for surfacing Wyzant tutors on a partner site
    and earning a per-lead bounty; not a public consumer API.
- aid: wyzant:wyzant-tutor-data-feed
  name: Wyzant Tutor Data Feed
  tags:
  - Tutors
  - Data Feed
  - Bulk Export
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://support.wyzant.com/hc/en-us/articles/115005857526-API-Data-Feed-Documentation
  baseURL: https://data.wyzant.com
  properties:
  - url: https://support.wyzant.com/hc/en-us/articles/115005857526-API-Data-Feed-Documentation
    type: Documentation
  - url: openapi/wyzant-openapi.yml
    type: OpenAPI
  description: Bulk data feed that returns a complete snapshot of all active
    tutors listed on Wyzant at the time of the request. An HTTP GET to
    /feeds/downloadFeed with a partner API key and a feedFormat of XML or JSON
    (plus an optional maxResults for testing) downloads the full tutor dataset.
    Because the file is large, Wyzant asks partners to pull it at most once per
    day and recommends refreshing a local copy at least weekly.
